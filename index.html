<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMP HTML Batch Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-found { @apply bg-green-100 text-green-800; }
        .status-not_found { @apply bg-yellow-100 text-yellow-800; }
        .status-error { @apply bg-red-100 text-red-800; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6 max-w-6xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">AMP HTML Batch Checker</h1>
        <p class="text-sm text-gray-500 mt-1">Paste multiple URLs (one per line) to check for <code class="bg-gray-200 px-1 rounded">&lt;link rel="amphtml"&gt;</code> tags.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Input Section -->
        <div class="lg:col-span-1 bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <label class="block text-sm font-medium text-gray-700 mb-2">Target URLs</label>
            <textarea id="urlInput" rows="12" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-mono" placeholder="https://example.com/page1&#10;https://example.com/page2&#10;example.com/page3"></textarea>
            <button onclick="checkAmp()" id="checkBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition flex items-center justify-center gap-2">
                <span>Check AMP</span>
            </button>
            <p id="statusMsg" class="text-xs text-gray-500 mt-3 text-center hidden"></p>
        </div>

        <!-- Results Section -->
        <div class="lg:col-span-2 bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Results</h2>
                <button onclick="downloadCSV()" id="downloadBtn" class="hidden text-sm bg-gray-800 hover:bg-gray-900 text-white py-1.5 px-3 rounded-md transition">
                    Download CSV
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th class="px-4 py-3 rounded-l-md">Source URL</th>
                            <th class="px-4 py-3">AMP URL</th>
                            <th class="px-4 py-3 rounded-r-md">Status</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="3" class="px-4 py-8 text-center text-gray-400">No results yet. Add URLs and click "Check AMP".</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentResults = [];

        async function checkAmp() {
            const input = document.getElementById('urlInput').value;
            const urls = input.split('\n').map(u => u.trim()).filter(u => u.length > 0);
            
            if (urls.length === 0) {
                alert('Please enter at least one URL.');
                return;
            }

            const btn = document.getElementById('checkBtn');
            const statusMsg = document.getElementById('statusMsg');
            const tbody = document.getElementById('resultsBody');
            const downloadBtn = document.getElementById('downloadBtn');

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;
            statusMsg.textContent = `Processing ${urls.length} URLs. Please wait...`;
            statusMsg.classList.remove('hidden');
            tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-400">Scraping in progress...</td></tr>';
            downloadBtn.classList.add('hidden');

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });

                const data = await response.json();
                currentResults = data.results;
                renderTable(currentResults);
                downloadBtn.classList.remove('hidden');
                statusMsg.textContent = `Successfully checked ${currentResults.length} URLs.`;
            } catch (error) {
                statusMsg.textContent = 'Error connecting to the API. Check console for details.';
                statusMsg.classList.add('text-red-600');
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Check AMP';
            }
        }

        function renderTable(results) {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            results.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                
                let statusClass = 'status-not_found';
                let statusText = 'Not Found';
                let ampDisplay = '<span class="text-gray-400">-</span>';

                if (row.status === 'found') {
                    statusClass = 'status-found';
                    statusText = 'Found';
                    ampDisplay = `<a href="${row.amp_url}" target="_blank" class="text-blue-600 hover:underline truncate block max-w-xs">${row.amp_url}</a>`;
                } else if (row.status === 'error') {
                    statusClass = 'status-error';
                    statusText = 'Error';
                    ampDisplay = `<span class="text-red-500 text-xs" title="${row.error}">Failed to fetch</span>`;
                }

                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-xs text-gray-600 truncate max-w-xs" title="${row.source_url}">${row.source_url}</td>
                    <td class="px-4 py-3">${ampDisplay}</td>
                    <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${statusClass}">${statusText}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadCSV() {
            if (currentResults.length === 0) return;
            
            let csvContent = "data:text/csv;charset=utf-8,Source URL,AMP URL,Status,Error Details\n";
            currentResults.forEach(row => {
                const source = `"${row.source_url}"`;
                const amp = row.amp_url ? `"${row.amp_url}"` : '""';
                const status = `"${row.status}"`;
                const error = row.error ? `"${row.error.replace(/"/g, '""')}"` : '""';
                csvContent += `${source},${amp},${status},${error}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `amp_check_results_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
